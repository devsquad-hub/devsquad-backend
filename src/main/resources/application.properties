quarkus.application.name=devsquad-api
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.shutdown.timeout=10s

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.max-size=${DATABASE_POOL_SIZE:10}
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/devsquad}
%prod.quarkus.datasource.username=${DATABASE_USER:devsquad}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD:devsquad}
%dev.quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/devsquad}
%dev.quarkus.datasource.username=${DATABASE_USER:devsquad}
%dev.quarkus.datasource.password=${DATABASE_PASSWORD:devsquad}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.validate-on-migrate=true

quarkus.oidc.enabled=${SECURITY_ENABLED:true}
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=${CLERK_ISSUER_URI:https://example.clerk.accounts.dev}
quarkus.oidc.token.issuer=${CLERK_ISSUER_URI:https://example.clerk.accounts.dev}
app.clerk.authorized-parties=${CLERK_AUTHORIZED_PARTIES:http://localhost:3000}

quarkus.http.auth.permission.public.paths=/q/health/*,/q/openapi,/q/swagger-ui/*,/actuator/health/readiness,/api/v1/public/*,/api/v1/webhooks/clerk
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.permission.api.paths=/api/v1/*
quarkus.http.auth.permission.api.policy=authenticated
quarkus.http.auth.permission.api.enabled=${SECURITY_ENABLED:true}

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type
quarkus.swagger-ui.always-include=${SWAGGER_UI_ENABLED:true}

app.membership.default-hub-slug=${DEFAULT_HUB_SLUG:devsquad}
app.clerk.webhook-secret=${CLERK_WEBHOOK_SECRET:}
app.bootstrap.enabled=${BOOTSTRAP_ENABLED:false}
app.bootstrap.hub-name=${BOOTSTRAP_HUB_NAME:}
app.bootstrap.hub-slug=${BOOTSTRAP_HUB_SLUG:}
app.bootstrap.master-clerk-user-id=${BOOTSTRAP_MASTER_CLERK_USER_ID:}
app.storage.endpoint=${S3_ENDPOINT:http://localhost:9000}
app.storage.public-endpoint=${S3_PUBLIC_ENDPOINT:http://localhost:9000}
app.storage.region=${S3_REGION:us-east-1}
app.storage.bucket=${S3_BUCKET:devsquad-attachments}
app.storage.initialize-bucket=${S3_INITIALIZE_BUCKET:true}
app.storage.access-key=${S3_ACCESS_KEY:devsquad}
app.storage.secret-key=${S3_SECRET_KEY:devsquad-secret}
app.storage.max-file-size=${S3_MAX_FILE_SIZE:10485760}

%test.quarkus.oidc.enabled=false
%test.quarkus.http.auth.permission.api.policy=permit
%test.quarkus.datasource.devservices.image-name=postgres:18.4-alpine
%test.app.storage.initialize-bucket=false
%test.app.bootstrap.enabled=false

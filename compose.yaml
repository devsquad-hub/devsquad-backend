services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: devsquad
      POSTGRES_USER: devsquad
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-devsquad}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devsquad"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-devsquad}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-devsquad-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null || wget -qO- http://localhost:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:

name: Security

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.168.0
    steps:
      - uses: actions/checkout@v5
      - run: semgrep --config p/security-audit --config p/owasp-top-ten --exclude 'src/test/**' --error --metrics=off --jobs 1 src
